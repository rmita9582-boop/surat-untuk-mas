<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>For You, Mas ♡</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background: #243B53;
            font-family: Georgia, serif;
            color: #243B53;
        }

        .paper {
            width: 80%;
            max-width: 650px;
            padding: 50px 35px;
            text-align: center;

            background: #F5F0E6;
            border: 2px solid #E7DED0;
            box-shadow: 0 15px 40px rgba(0,0,0,0.25);
        }

        h1 {
            font-size: 42px;
            margin-bottom: 20px;
        }

        p {
            font-size: 18px;
            line-height: 1.8;
        }

        .button {
            display: inline-block;
            margin-top: 25px;
            padding: 13px 25px;

            background: #587A9E;
            color: white;

            text-decoration: none;
            border-radius: 4px;
        }

        .small {
            margin-top: 30px;
            font-size: 14px;
            opacity: 0.7;
        }
    </style>
</head>

<body>

    <div class="paper">

        <h1>FOR YOU, MAS ♡</h1>

        <p>
            Ada sedikit pesan yang ingin Adek sampaikan...
        </p>

        <a href="#pesan" class="button">
            OPEN MY LETTER ♡
        </a>

        <p class="small">
            — from Adek —
        </p>

    </div>

</body>
</html>
